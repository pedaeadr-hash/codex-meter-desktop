name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build CodexMeter.slnx --configuration Release
      - name: Smoke tests
        run: dotnet run --project tests/CodexMeter.SmokeTests --configuration Release

